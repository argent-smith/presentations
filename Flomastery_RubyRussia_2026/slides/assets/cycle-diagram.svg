<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="Пайплайн эксперимента: claude -p headless на claude-sonnet-5 c effort xhigh реализует тикет, проходит саморевью, затем три гейта — штатные тесты, acceptance-смок, контрактная проверка по Schemathesis; при красном гейте пунктирная стрелка возвращает на фикс и повторное ревью, при всех зелёных гейтах тикет считается сошедшимся">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dfe4ea"/>
    </marker>
  </defs>

  <rect x="20" y="90" width="190" height="100" rx="8" fill="none" stroke="#ff5d7d" stroke-width="2"/>
  <text x="115" y="130" text-anchor="middle" font-weight="700" font-size="16" fill="#ff5d7d">claude -p</text>
  <text x="115" y="152" text-anchor="middle" font-size="12" fill="#dfe4ea">headless</text>
  <text x="115" y="170" text-anchor="middle" font-size="12" fill="#dfe4ea">sonnet-5 · xhigh</text>

  <line x1="210" y1="140" x2="246" y2="140" stroke="#dfe4ea" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="90" width="130" height="100" rx="8" fill="none" stroke="#dfe4ea" stroke-width="1.5"/>
  <text x="315" y="145" text-anchor="middle" font-size="14" fill="#dfe4ea">реализация</text>

  <line x1="380" y1="140" x2="416" y2="140" stroke="#dfe4ea" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="90" width="130" height="100" rx="8" fill="none" stroke="#dfe4ea" stroke-width="1.5"/>
  <text x="485" y="145" text-anchor="middle" font-size="14" fill="#dfe4ea">саморевью</text>

  <line x1="550" y1="140" x2="586" y2="57.5" stroke="#dfe4ea" stroke-width="1.5"/>
  <line x1="550" y1="140" x2="586" y2="140" stroke="#dfe4ea" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="140" x2="586" y2="222.5" stroke="#dfe4ea" stroke-width="1.5"/>

  <rect x="590" y="25" width="190" height="65" rx="6" fill="none" stroke="#dfe4ea" stroke-width="1.5"/>
  <text x="685" y="63" text-anchor="middle" font-size="13" fill="#dfe4ea">штатные тесты</text>

  <rect x="590" y="107.5" width="190" height="65" rx="6" fill="none" stroke="#dfe4ea" stroke-width="1.5"/>
  <text x="685" y="145.5" text-anchor="middle" font-size="13" fill="#dfe4ea">acceptance-смок</text>

  <rect x="590" y="190" width="190" height="65" rx="6" fill="none" stroke="#dfe4ea" stroke-width="1.5"/>
  <text x="685" y="218" text-anchor="middle" font-size="13" fill="#dfe4ea">контракт</text>
  <text x="685" y="234" text-anchor="middle" font-size="11" fill="#dfe4ea">(Schemathesis)</text>

  <line x1="780" y1="57.5" x2="816" y2="140" stroke="#dfe4ea" stroke-width="1.5"/>
  <line x1="780" y1="140" x2="816" y2="140" stroke="#dfe4ea" stroke-width="1.5"/>
  <line x1="780" y1="222.5" x2="816" y2="140" stroke="#dfe4ea" stroke-width="1.5"/>
  <line x1="816" y1="140" x2="826" y2="140" stroke="#dfe4ea" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="885" y="72" text-anchor="middle" font-size="12" fill="#ffd166">все зелёные</text>

  <rect x="830" y="90" width="110" height="100" rx="8" fill="none" stroke="#ffd166" stroke-width="2"/>
  <text x="885" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#ffd166">сошлось</text>
  <text x="885" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#ffd166">/ сдалось</text>

  <polyline points="685,255 685,300 315,300 315,194" fill="none" stroke="#dfe4ea" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="500" y="317" text-anchor="middle" font-size="12" fill="#dfe4ea">фикс — если хоть один гейт красный</text>
</svg>
